<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugs Bunny Lost in Time</title>
<style>
  :root { --bg: #0d0b1a; --fg: #f4f1ff; --muted: #a59fc4; --accent: #ff8a1f; --bar: #2a2545; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 100vw; height: 100vh; height: 100dvh; display: none; }
  #game { width: 100%; height: 100%; }
  #intro { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px 16px; text-align: center; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); letter-spacing: .5px; }
  p { margin: 0; color: var(--muted); max-width: 520px; line-height: 1.5; }
  button { font: inherit; font-size: 20px; font-weight: 600; padding: 14px 40px; border: 0; border-radius: 999px; background: var(--accent); color: #1a0f00; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.5em; }
  .keys { font-size: 14px; }
  .keys b { color: var(--fg); }
  #buffer { position: fixed; right: 12px; bottom: 12px; z-index: 10; padding: 6px 10px; border-radius: 6px; background: rgba(0,0,0,.6); color: var(--muted); font-size: 12px; pointer-events: none; transition: opacity 1s; }
</style>
</head>
<body>
<div id="intro">
  <h1>Bugs Bunny: Lost in Time</h1>
  <p>Versione europea per PlayStation, emulata nel browser.</p>
  <button id="play">Gioca</button>
  <p id="status"></p>
  <p class="keys">Comandi: <b>frecce</b> = movimento, <b>Invio</b> = Start; gli altri tasti sono nel menu <b>Controlli</b> dell’emulatore.<br>
    Funziona anche con un gamepad e, su smartphone, con i comandi touch.</p>
</div>
<div id="stage"><div id="game"></div></div>
<div id="buffer" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>
<script>
const EJS_DATA = "https://cdn.emulatorjs.org/4.2.3/data/";
const CACHE_NAME = "bugsbunny-blocks-v1";
const GAME_FILE = "game.bin";

const playBtn = document.getElementById("play");
const statusEl = document.getElementById("status");
const bufferEl = document.getElementById("buffer");

// ---------------------------------------------------------------------------
// Disco in streaming: il CD e' diviso in blocchi da 512 KB compressi (site/game/b).
// L'emulatore legge il file in modo sincrono, quindi un blocco che manca viene
// scaricato subito con una richiesta sincrona; nel frattempo tutti gli altri
// blocchi arrivano in background e restano nella cache del browser.
// ---------------------------------------------------------------------------
const disc = {
  manifest: null,
  compressed: new Map(),   // indice -> blocco gzip
  recent: new Map(),       // piccola LRU di blocchi gia' decompressi
  queue: [],               // blocchi da scaricare con priorita'
  cursor: 0,               // prossimo blocco per il download in sequenza
  inFlight: new Set(),
  cache: null,
  waits: [],               // [blocco, ms] per ogni attesa sincrona (diagnostica)
};

function blockUrl(i) {
  return "game/b/" + String(i).padStart(4, "0");
}

function fetchBlockSync(i) {
  const xhr = new XMLHttpRequest();
  xhr.open("GET", blockUrl(i), false);
  xhr.overrideMimeType("text/plain; charset=x-user-defined");
  xhr.send();
  if (xhr.status !== 200) throw new Error(`Blocco ${i}: errore ${xhr.status}`);
  const text = xhr.responseText;
  const bytes = new Uint8Array(text.length);
  for (let k = 0; k < text.length; k++) bytes[k] = text.charCodeAt(k) & 0xff;
  return bytes;
}

function getBlock(i) {
  let data = disc.recent.get(i);
  if (data) {
    disc.recent.delete(i);
    disc.recent.set(i, data);
    return data;
  }
  let gz = disc.compressed.get(i);
  if (!gz) {
    const t = performance.now();
    gz = fetchBlockSync(i);
    disc.compressed.set(i, gz);
    disc.waits.push([i, Math.round(performance.now() - t)]);
  }
  data = pako.ungzip(gz);
  disc.recent.set(i, data);
  if (disc.recent.size > 32) disc.recent.delete(disc.recent.keys().next().value);
  // Lettura anticipata: i dischi si leggono quasi sempre in sequenza.
  for (let k = i + 1; k <= i + 8 && k < disc.manifest.blocks; k++) {
    if (!disc.compressed.has(k)) disc.queue.push(k);
  }
  pumpDownloads();
  return data;
}

function readDisc(buffer, offset, length, position) {
  const size = disc.manifest.size;
  const bs = disc.manifest.blockSize;
  if (position >= size) return 0;
  length = Math.min(length, size - position);
  let done = 0;
  while (done < length) {
    const pos = position + done;
    const block = getBlock(Math.floor(pos / bs));
    const start = pos % bs;
    const n = Math.min(length - done, block.length - start);
    buffer.set(block.subarray(start, start + n), offset + done);
    done += n;
  }
  return done;
}

function nextBlockToFetch() {
  while (disc.queue.length) {
    const i = disc.queue.shift();
    if (!disc.compressed.has(i) && !disc.inFlight.has(i)) return i;
  }
  while (disc.cursor < disc.manifest.blocks) {
    const i = disc.cursor++;
    if (!disc.compressed.has(i) && !disc.inFlight.has(i)) return i;
  }
  return -1;
}

async function fetchBlock(i) {
  const url = blockUrl(i);
  let res = disc.cache ? await disc.cache.match(url) : null;
  if (!res) {
    res = await fetch(url);
    if (!res.ok) throw new Error(`Blocco ${i}: errore ${res.status}`);
    if (disc.cache) {
      try { await disc.cache.put(url, res.clone()); } catch (e) { /* quota piena: si continua senza cache */ }
    }
  }
  return new Uint8Array(await res.arrayBuffer());
}

function pumpDownloads() {
  while (disc.inFlight.size < 4) {
    const i = nextBlockToFetch();
    if (i < 0) break;
    disc.inFlight.add(i);
    fetchBlock(i)
      .then(gz => { if (!disc.compressed.has(i)) disc.compressed.set(i, gz); })
      .catch(e => { console.warn(e); setTimeout(() => { disc.queue.push(i); pumpDownloads(); }, 2000); })
      .finally(() => { disc.inFlight.delete(i); updateBuffer(); pumpDownloads(); });
  }
}

function updateBuffer() {
  const pct = Math.floor(disc.compressed.size / disc.manifest.blocks * 100);
  bufferEl.hidden = false;
  bufferEl.textContent = `Disco caricato: ${pct}%`;
  if (pct >= 100) setTimeout(() => { bufferEl.style.opacity = 0; }, 3000);
}

// Crea nel filesystem dell'emulatore un file che non contiene dati:
// ogni lettura passa da readDisc().
function mountDisc(FS) {
  const path = "/" + GAME_FILE;
  FS.writeFile(path, new Uint8Array(0));
  const node = FS.lookupPath(path).node;
  node.usedBytes = disc.manifest.size;
  node.stream_ops = Object.assign({}, node.stream_ops, {
    read: (stream, buffer, offset, length, position) => readDisc(buffer, offset, length, position),
    write: () => { throw new FS.ErrnoError(30); },
  });
}

// ---------------------------------------------------------------------------

function startEmulator() {
  window.EJS_player = "#game";
  window.EJS_core = "psx";
  window.EJS_gameName = "Bugs Bunny - Lost in Time";
  window.EJS_gameID = 1;
  window.EJS_gameUrl = "game/" + GAME_FILE; // mai scaricato: il disco e' montato da mountDisc()
  window.EJS_pathtodata = EJS_DATA;
  window.EJS_language = "it-IT";
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#ff8a1f";
  window.EJS_ready = () => {
    const emu = window.EJS_emulator;
    emu.downloadRom = async () => {
      mountDisc(emu.gameManager.FS);
      emu.fileName = GAME_FILE;
    };
  };

  document.getElementById("intro").style.display = "none";
  document.getElementById("stage").style.display = "block";

  const s = document.createElement("script");
  s.src = EJS_DATA + "loader.js";
  document.body.appendChild(s);
}

playBtn.addEventListener("click", async () => {
  if (typeof pako === "undefined") {
    statusEl.textContent = "Errore di rete: ricarica la pagina.";
    return;
  }
  playBtn.disabled = true;
  statusEl.textContent = "Avvio…";
  try {
    disc.manifest = await (await fetch("game/manifest.json", { cache: "no-cache" })).json();
    try { disc.cache = await caches.open(CACHE_NAME); } catch (e) { disc.cache = null; }
    // ?nopreload: niente download in background, solo blocchi a richiesta (per i test).
    if (new URLSearchParams(location.search).has("nopreload")) disc.cursor = disc.manifest.blocks;
    pumpDownloads();
    startEmulator();
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Errore: " + e.message;
    playBtn.disabled = false;
  }
});
</script>
</body>
</html>
